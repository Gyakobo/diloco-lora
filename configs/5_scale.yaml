# Phase 5 -- does it hold on a ~3x larger, modern model? SmolLM2-360M on Dolly (category split).
# Run 1 sync run first and check peak_mem_gb in its .json; drop micro_batch to 1 if it OOMs.
base:
  model_name: HuggingFaceTB/SmolLM2-360M
  task: dolly
  block_size: 512
  micro_batch: 2
  rank: 16
  lora_alpha: 32
  steps: 1000
  lr: 0.0003
grids:
  - - {mode: diloco, k: 4, H: 50, batch_size: 8, split: group, agg: fedit}
    - {mode: diloco, k: 4, H: 50, batch_size: 8, split: group, agg: ffa}
    - {mode: diloco, k: 4, H: 50, batch_size: 8, split: group, agg: merge, inner_state: reset}
  - - {outer_lr: 1.0, outer_momentum: 0.0, nesterov: false}
    - {outer_lr: 0.7, outer_momentum: 0.9, nesterov: true}
sweep:
  seed: [0, 1]
runs:
  - {mode: sync, agg: fedit, batch_size: 32, seed: 0}
  - {mode: sync, agg: fedit, batch_size: 32, seed: 1}
